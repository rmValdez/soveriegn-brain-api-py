services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sovereign_brain_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sovereign_brain
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: sovereign_brain_api
    depends_on:
      - db
    ports:
      - "3009:3009"
    environment:
      # Override the DATABASE_URL to point to the docker-compose 'db' service
      - DATABASE_URL=postgresql+psycopg://postgres:mysecretpassword@db:5432/sovereign_brain
      # Point to host machine's Ollama instance (works on Docker Desktop)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      # Mount source code and migrations for live reloading and synced migrations
      - ./src:/app/src
      - ./alembic:/app/alembic
    restart: unless-stopped

volumes:
  pgdata:
